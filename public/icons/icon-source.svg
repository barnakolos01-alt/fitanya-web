<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Forrás ikon a FitAnya PWA-hoz.
    A szív a maskable-safe zónán (a kép közepén, 80%-os átmérőjű körön) belül van,
    így ugyanez a fájl "any" és "maskable" célra is exportálható.

    Exportálás PNG-be (pl. https://realfavicongenerator.net vagy az
    npx pwa-asset-generator icon-source.svg ./icons parancs):
      - icon-192.png            192x192
      - icon-512.png            512x512
      - icon-maskable-512.png   512x512 (ugyanez a fájl, maskable jelöléssel)
  -->
  <rect width="512" height="512" rx="0" fill="#E07A5F" />
  <path
    d="M256,196 C230,146 150,146 150,214 C150,276 256,344 256,344 C256,344 362,276 362,214 C362,146 282,146 256,196 Z"
    fill="#FFFFFF"
  />
</svg>
